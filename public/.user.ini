; PHP is consulted about an upload before Laravel is: a file bigger than
; upload_max_filesize is dropped by the SAPI and arrives as a failed upload,
; whatever the form says. The employee masterlist import has no size ceiling of
; its own, so these are raised to the request size nginx already accepts
; (client_max_body_size in nginx.template.conf).
;
; PHP's built-in default is 2 MB in php.ini-production, which is what a bare
; Nixpacks PHP build runs with. Read by PHP-FPM from the directory of the
; executing script (public/index.php) - no restart of the image needed.

upload_max_filesize = 64M
post_max_size = 64M
