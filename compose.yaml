# Local development stack for NU Trace.
#
# One container: the app, served by `php artisan serve`. The database is the
# Supabase Postgres project itself, read from .env exactly as on Railway, so
# the data you see locally is the same data the deployed site shows.
#
# The Laravel Sail stack this replaced is kept in compose.sail.yaml. Sail also
# starts MySQL, Redis, Meilisearch, Mailpit and Selenium on their default ports,
# none of which this app uses, and it binds port 80.
#
# The code is bind-mounted, not copied: edit a file on this machine and the
# running server picks it up on the next request (no rebuild, no restart).
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.local
        image: 'nutrace-app:local'
        container_name: nutrace-app
        working_dir: /var/www/html
        command: php artisan serve --host=0.0.0.0 --port=8080
        ports:
            - '8000:8080'
        volumes:
            - '.:/var/www/html'
        environment:
            # Overrides .env for the container only: the site answers on :8000
            # here, while the deployed site keeps its own APP_URL.
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: 'http://localhost:8000'
            HOME: /tmp
        # Host user, so files the app writes (logs, sessions, cache, uploads to
        # the local disk) stay owned by you and remain editable outside Docker.
        user: '1000:1000'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
